ansible_user: ubuntu
ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR'

bench_home: /opt/filestream-bench
bench_work_dir: /var/lib/filestream-bench
filebeat_home: /opt/filestream-bench/filebeat

# Filebeat source, in precedence order: binary_path, tarball_path, url, version.
filebeat_version: ""
filebeat_url: ""
filebeat_tarball_path: ""
filebeat_binary_path: ""
filestream_bench_binary_path: ""

filebeat_is_snapshot: "{{ '-SNAPSHOT' in (filebeat_version | string) }}"
filebeat_artifacts_api: "https://artifacts-api.elastic.co/v1/search/{{ filebeat_version }}"
tgz_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'x86_64' }}"
filebeat_tgz_name: "filebeat-{{ filebeat_version }}-linux-{{ tgz_arch }}.tar.gz"

go_version: "{{ lookup('file', (playbook_dir + '/../../../../../.go-version') | realpath) | trim }}"
go_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
go_tgz_name: "go{{ go_version }}.linux-{{ go_arch }}.tar.gz"
go_download_url: "https://go.dev/dl/{{ go_tgz_name }}"
